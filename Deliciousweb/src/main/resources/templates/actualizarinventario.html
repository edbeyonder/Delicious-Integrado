
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Actualizar Inventario</title>
</head>
    <body>
   <a th:href="@{/dashboard}" class="btn-regresar">
    &#11013; Regresar
</a>
<div class="form-container">

<div class="sales-form">

<h2>Agregar producto</h2>

<form th:action="@{/inventario/guardar}"
      th:object="${inventario}"
      method="post">

    <input type="hidden" th:field="*{idProducto}">
    <input type="hidden" th:field="*{fechaRegistro}">

  <label>Nombre del Producto</label>
<input type="text" th:field="*{nombreProducto}">

<span style="color:red"
      th:if="${#fields.hasErrors('nombreProducto')}"
      th:errors="*{nombreProducto}">
</span>

   <label>Cantidad</label>
<input type="number" th:field="*{cantidad}">

<span style="color:red"
      th:if="${#fields.hasErrors('cantidad')}"
      th:errors="*{cantidad}">
</span>

  <label>Precio</label>
<input type="number" step="0.01" th:field="*{precio}">

<span style="color:red"
      th:if="${#fields.hasErrors('precio')}"
      th:errors="*{precio}">
</span>
    <button type="submit">
        Guardar Producto
    </button>

</form>

</div>

</div>
        </body>

</html>
